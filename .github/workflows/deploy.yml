name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Rebuild daily to pick up changes in the data repository.
  schedule:
    - cron: "17 6 * * *"
  # The data repository can trigger an immediate rebuild with:
  #   gh api repos/DeathCamel58/dahua-firmware-compatible-site/dispatches -f event_type=data-updated
  repository_dispatch:
    types: [data-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The site reads its data from here (see src/lib/data.ts): the two JSON indexes plus the
      # per-firmware detail files and partition layouts under data/.
      DATA_DIR: ${{ github.workspace }}/.pipeline-data
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout firmware data
        uses: actions/checkout@v7
        with:
          repository: DeathCamel58/amcrest-compatible-finder
          ref: master
          path: .pipeline-data
          # Only the data, not the pipeline's code or docs.
          sparse-checkout: |
            /cameras.json
            /firmware_compatible.json
            /data/
          sparse-checkout-cone-mode: false
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
